<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>FST Floor Helper</title>
  <script defer src="https://jsdelivr.net"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 14px; background: var(--bg); color: var(--text); padding-bottom: 60px; }
    h1 { font-size: 1.25rem; margin: 0 0 12px 0; display: flex; justify-content: space-between; align-items: center; }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab-btn {
      flex: 1; padding: 12px; border: 1px solid var(--border); background: var(--card);
      color: var(--muted); border-radius: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
    }
    .tab-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }
    .panel { display: none; }
    .panel.active { display: block; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    textarea.paste-box {
      width: 100%; background: #0f172a; color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px; font-size: 0.9rem; margin-top: 8px; resize: vertical;
    }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .btn {
      padding: 12px 14px; border-radius: 10px; border: none; font-weight: 700;
      font-size: 0.95rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-primary { background: var(--accent); color: #0f172a; flex: 1; }
    .btn-danger { background: rgba(239, 68, 68, 0.18); color: #fca5a5; border: 1px solid var(--danger); }
    .btn-note { background: #334155; color: var(--text); padding: 8px 12px; font-size: 0.85rem; }
    .btn-note.has-note { background: rgba(245, 158, 11, 0.22); color: #fcd34d; border: 1px solid var(--warn); }
    .status-bar { font-size: 0.85rem; color: var(--muted); margin-top: 8px; display: flex; justify-content: space-between; }
    .item-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; margin-bottom: 8px; transition: opacity 0.15s;
    }
    .item-row.checked { opacity: 0.55; border-color: var(--success); }
    .item-left { display: flex; align-items: center; gap: 12px; flex: 1; cursor: pointer; }
    .chk-box {
      width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--accent);
      display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0;
    }
    .item-row.checked .chk-box { background: var(--success); border-color: var(--success); color: #052e16; font-weight: 900; }
    .loc-code { font-size: 1.15rem; font-weight: 800; letter-spacing: 0.5px; }
    .item-row.checked .loc-code { text-decoration: line-through; }
    .time-tag { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .note-preview { font-size: 0.82rem; color: #fcd34d; margin-top: 4px; word-break: break-word; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <h1>
    <span>🎰 FST Floor Helper</span>
    <span id="counterBadge" style="font-size: 0.9rem; color: var(--accent);">0 / 0</span>
  </h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('checkTab', this)">📋 Floor Check</button>
    <button class="tab-btn" onclick="switchTab('swapTab', this)">💵 Cashbox Email</button>
  </div>

  <!-- TAB 1: MACHINE FLOOR CHECKLIST -->
  <div id="checkTab" class="panel active">
    <div class="card">
      <div class="controls">
        <label class="btn btn-primary" for="photoInput">📷 Upload Screenshots</label>
        <input type="file" id="photoInput" accept="image/*,.jfif,.heic,.heif" multiple />
        <button class="btn btn-danger" onclick="resetDailyList()">🔄 Reset</button>
      </div>
      <div class="status-bar">
        <span id="ocrStatus">Ready — select 1 to 3+ photos</span>
        <span>Sorted A → Z</span>
      </div>

      <details style="margin-top: 10px;">
        <summary style="font-size: 0.85rem; color: var(--accent); cursor: pointer;">⚡ Or Paste Copied Text (Instant)</summary>
        <textarea id="pasteInput" class="paste-box" rows="3" placeholder="Paste rows copied from iPhone Photos here..."></textarea>
        <button class="btn btn-primary" style="width: 100%; margin-top: 6px; padding: 9px;" onclick="parsePastedText()">➕ Add Pasted List</button>
      </details>
    </div>

    <div id="checklistContainer"></div>
  </div>

  <!-- TAB 2: CASHBOX SWAP EMAIL (READY FOR PHASE 2) -->
  <div id="swapTab" class="panel">
    <div class="card">
      <p style="margin: 0; color: var(--muted); font-size: 0.92rem;">
        Cashbox Swap Email Generator will be plugged in here next!
      </p>
    </div>
  </div>
  <script>
    const STORAGE_KEY = 'fst_floor_checklist_v1';
    let machineList = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

    function switchTab(tabId, btn) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    // Automatically loads Tesseract from multiple backup CDNs if the first one is blocked
    function ensureTesseractLoaded(statusEl) {
      if (typeof Tesseract !== 'undefined') return Promise.resolve();

      const urls = [
        'https://jsdelivr.net',
        'https://unpkg.com',
        'https://cloudflare.com'
      ];

      return new Promise((resolve, reject) => {
        let idx = 0;
        function tryNext() {
          if (typeof Tesseract !== 'undefined') return resolve();
          if (idx >= urls.length) {
            return reject(new Error('Network blocked OCR script. Try switching off work Wi-Fi or use Paste Text.'));
          }
          statusEl.textContent = `Loading scanner (source ${idx + 1}/${urls.length})...`;
          const s = document.createElement('script');
          s.src = urls.at(idx++);
          s.onload = () => (typeof Tesseract !== 'undefined' ? resolve() : tryNext());
          s.onerror = () => tryNext();
          document.head.appendChild(s);
        }
        tryNext();
      });
    }

    function extractRowsFromText(rawText) {
      let added = 0;
      const lines = rawText.split(/\r?\n/);

      lines.forEach(line => {
        const clean = line.trim();
        if (!clean) return;

        // Match Bank (e.g. N25) + Location (e.g. 01) even if OCR inserts spaces, pipes, dots, or dashes
        const locMatch = clean.match(/\b([A-Z]\d{2})[^A-Z0-9\n]{1,6}(\d{2})\b/i);
        if (locMatch) {
          const bank = locMatch.at(1).toUpperCase();
          const loc = locMatch.at(2);
          const code = `${bank}-${loc}`;

          // Match Time (e.g. 11:00:00 PM or 11:00 PM) on the same row
          const timeMatch = clean.match(/\b(\d{1,2}:\d{2}(?::\d{2})?\s*(?:AM|PM)?)\b/i);
          const timeStr = timeMatch ? timeMatch.at(1).toUpperCase() : '';

          if (!machineList.some(item => item.code === code)) {
            machineList.push({
              id: Date.now() + Math.random(),
              code: code,
              time: timeStr,
              checked: false,
              note: ''
            });
            added++;
          }
        }
      });

      if (added > 0) {
        machineList.sort((a, b) => a.code.localeCompare(b.code));
        saveAndRender();
      }
      return added;
    }

    function parsePastedText() {
      const box = document.getElementById('pasteInput');
      const statusEl = document.getElementById('ocrStatus');
      if (!box.value.trim()) return;

      const added = extractRowsFromText(box.value);
      statusEl.textContent = added > 0
        ? `Done! Added ${added} machine(s) from text.`
        : 'No Bank-Location codes found in pasted text.';
      box.value = '';
    }

    function prepareImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const targetW = Math.min(1200, img.width);
            const scale = targetW / img.width;
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/png'));
          };
          img.onerror = () => reject(new Error(`Browser cannot decode file: ${file.name}`));
          img.src = reader.result;
        };
        reader.onerror = () => reject(new Error('Failed to read selected file'));
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('photoInput').addEventListener('change', async function (e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      const statusEl = document.getElementById('ocrStatus');
      let addedCount = 0;
      let rawLog = [];

      try {
        await ensureTesseractLoaded(statusEl);

        statusEl.textContent = 'Starting OCR engine...';
        const worker = await Tesseract.createWorker('eng', 1, {
          langPath: 'https://projectnaptha.com'
        });
        await worker.setParameters({
          tessedit_pageseg_mode: '4',
          preserve_interword_spaces: '1'
        });

        for (let i = 0; i < files.length; i++) {
          const f = files.at(i);
          statusEl.textContent = `Scanning ${i + 1}/${files.length} (${f.name})...`;
          const imgData = await prepareImage(f);
          const result = await worker.recognize(imgData);
          const text = result.data.text || '';
          rawLog.push(text);
          addedCount += extractRowsFromText(text);
        }

        await worker.terminate();
      } catch (err) {
        console.error(err);
        statusEl.textContent = `Error: ${err.message || err}`;
        e.target.value = '';
        return;
      }

      if (addedCount > 0) {
        statusEl.textContent = `Done! Added ${addedCount} machine(s).`;
      } else {
        window._lastOcrText = rawLog.join('\n---\n') || '(No text detected)';
        statusEl.innerHTML = `0 matches. <a href="#" style="color:var(--accent)" onclick="alert(window._lastOcrText);return false;">View raw scan</a>`;
      }

      e.target.value = '';
    });
    function toggleCheck(id) {
      const item = machineList.find(m => m.id === id);
      if (item) {
        item.checked = !item.checked;
        saveAndRender();
      }
    }

    function editNote(id) {
      const item = machineList.find(m => m.id === id);
      if (!item) return;
      const input = prompt(`Error / Note for ${item.code}:`, item.note || '');
      if (input !== null) {
        item.note = input.trim();
        saveAndRender();
      }
    }

    function resetDailyList() {
      if (!machineList.length) return;
      if (confirm('Clear all machines and notes for a new shift?')) {
        machineList = [];
        saveAndRender();
        document.getElementById('ocrStatus').textContent = 'List cleared — ready for new photos';
      }
    }

    function saveAndRender() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(machineList));
      const container = document.getElementById('checklistContainer');
      const badge = document.getElementById('counterBadge');

      const doneCount = machineList.filter(m => m.checked).length;
      badge.textContent = `${doneCount} / ${machineList.length}`;

      if (!machineList.length) {
        container.innerHTML = `<div class="card" style="text-align:center; color:var(--muted); padding:24px;">
          No machines loaded yet.<br>Tap <b>Upload Screenshots</b> above to start.
        </div>`;
        return;
      }

      container.innerHTML = machineList.map(item => `
        <div class="item-row ${item.checked ? 'checked' : ''}">
          <div class="item-left" onclick="toggleCheck(${item.id})">
            <div class="chk-box">${item.checked ? '✓' : ''}</div>
            <div>
              <div class="loc-code">${item.code}</div>
              ${item.time ? `<div class="time-tag">🕒 ${item.time}</div>` : ''}
              ${item.note ? `<div class="note-preview">⚠️ ${escapeHtml(item.note)}</div>` : ''}
            </div>
          </div>
          <button class="btn btn-note ${item.note ? 'has-note' : ''}" onclick="editNote(${item.id})">
            ${item.note ? '✏️ Note' : '+ Note'}
          </button>
        </div>
      `).join('');
    }
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Load saved checklist on startup
    saveAndRender();
  </script>
</body>
</html>
